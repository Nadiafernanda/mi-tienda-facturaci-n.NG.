{% extends "base.html" %}
{% block titulo %}Crear cuenta{% endblock %}
{% block contenido %}
<section class="tarjeta formulario">
    <h1 class="titulo-pagina">Crear cuenta</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="botonera">
            <button type="submit">Registrarme</button>
            <a href="{% url 'login' %}">Ya tengo una cuenta</a>
        </div>
    </form>
</section>
{% endblock %}
