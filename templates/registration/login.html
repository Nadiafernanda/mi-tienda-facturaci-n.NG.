{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<section class="tarjeta formulario">
    <h1 class="titulo-pagina">Iniciar sesión</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="botonera">
            <button type="submit">Entrar</button>
            <a href="{% url 'registro' %}">¿No tienes cuenta? Regístrate</a>
        </div>
    </form>
</section>
{% endblock %}
