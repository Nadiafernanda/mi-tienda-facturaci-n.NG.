{% extends "base.html" %}
{% block titulo %}Eliminar producto{% endblock %}
{% block contenido %}
<section class="tarjeta">
    <h1 class="titulo-pagina">Eliminar producto</h1>
    <p>¿Seguro que deseas eliminar <strong>{{ producto.nombre }}</strong>?</p>
    <form method="post" class="botonera">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a class="boton-secundario-accion" href="{% url 'facturacion:producto_detalle' producto.pk %}">Cancelar</a>
    </form>
</section>
{% endblock %}
