{% if pagina.paginator.num_pages > 1 %}
<nav class="paginacion" aria-label="Paginación">
    <div>
        {% if pagina.has_previous %}
            <a href="?q={{ q|urlencode }}&page={{ pagina.previous_page_number }}">Anterior</a>
        {% endif %}
    </div>
    <span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>
    <div>
        {% if pagina.has_next %}
            <a href="?q={{ q|urlencode }}&page={{ pagina.next_page_number }}">Siguiente</a>
        {% endif %}
    </div>
</nav>
{% endif %}
