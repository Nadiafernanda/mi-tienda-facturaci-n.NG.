{% extends "base.html" %}
{% block titulo %}Eliminar cliente{% endblock %}
{% block contenido %}
<section class="tarjeta">
    <h1 class="titulo-pagina">Eliminar cliente</h1>
    <p>¿Seguro que deseas eliminar a <strong>{{ cliente }}</strong>?</p>
    <form method="post" class="botonera">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a class="boton-secundario-accion" href="{% url 'facturacion:cliente_lista' %}">Cancelar</a>
    </form>
</section>
{% endblock %}
