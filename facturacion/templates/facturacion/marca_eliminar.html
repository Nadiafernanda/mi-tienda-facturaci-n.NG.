{% extends "base.html" %}
{% block titulo %}Eliminar marca{% endblock %}
{% block contenido %}
<section class="tarjeta">
    <h1 class="titulo-pagina">Eliminar marca</h1>
    <p>¿Seguro que deseas eliminar la marca <strong>{{ marca.nombre }}</strong>?</p>
    <p class="texto-suave">No se puede eliminar una marca que todavía tiene productos asociados.</p>
    <form method="post" class="botonera">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a class="boton-secundario-accion" href="{% url 'facturacion:marca_lista' %}">Cancelar</a>
    </form>
</section>
{% endblock %}
